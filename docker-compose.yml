# Portafolio — servidor Next.js (standalone) detrás del Traefik del VPS.
#
# Vive en el VPS en /var/www/portfolio/ junto a su .env (ver .env.example).
# Lo sube y lo levanta ./deploy.sh; a mano sería:
#
#   docker compose build && docker compose up -d
#
# Traefik descubre el servicio por labels (corre con exposedbydefault=false,
# así que sin traefik.enable=true sería invisible) y emite el certificado con
# el certresolver `letsencrypt` que ya existe en el host — igual que
# apicehq.com y stats.apicehq.com.
#
# ¿VPS sin Traefik? Ver deploy/compose.caddy.yml.

name: portfolio

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?Falta DOMAIN en .env}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${PLAUSIBLE_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_SRC: ${UMAMI_SRC:-}
    image: portfolio-web:latest
    restart: unless-stopped
    init: true
    # El servidor no escribe en disco salvo la caché de imágenes de Next.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
      - "traefik.http.routers.portfolio.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portfolio.middlewares=portfolio-hsts"
      - "traefik.http.middlewares.portfolio-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.portfolio-hsts.headers.stsIncludeSubdomains=true"
      # Sin router para www: DOMAIN es un subdominio (carlo.apicehq.com). Si algún
      # día el portafolio pasa a un dominio raíz propio, ver "Dominio raíz y www"
      # en docs/DEPLOY.md.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  traefik-public:
    external: true # red compartida que ya maneja el Traefik del host
